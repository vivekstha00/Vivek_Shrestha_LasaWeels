services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lasawheels_app
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www
    networks:
      - lasawheels

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: lasawheels_web
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      - app
    volumes:
      - .:/var/www
    networks:
      - lasawheels

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lasawheels_scheduler
    restart: unless-stopped
    env_file:
      - .env.docker
    command: php artisan schedule:work --verbose --no-interaction
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www
    networks:
      - lasawheels

  db:
    image: mysql:8.0
    container_name: lasawheels_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lasaWheelsNepal
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lasawheels

volumes:
  db_data:

networks:
  lasawheels:
    driver: bridge
